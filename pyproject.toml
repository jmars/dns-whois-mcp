[project]
name = "dns-whois-mcp"
version = "0.1.0"
description = "FastMCP server for DNS lookups and WHOIS domain research — part of the Palimpsest intelligence toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "dnspython>=2.7.0",
    "asyncwhois>=1.0.0",
]

[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
